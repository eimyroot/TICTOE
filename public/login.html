<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#05070c" />
  <title>T3A // Private Arena</title>
  <style>
    :root{color-scheme:dark;--bg:#05070c;--panel:#0b1019;--line:#1c2634;--cyan:#00f2fe;--magenta:#ff007f;--green:#39ff14;--muted:#7f8da3}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 30% 20%,#0c1b28 0,transparent 35%),radial-gradient(circle at 75% 80%,#220817 0,transparent 35%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef5ff;display:grid;place-items:center;padding:24px}
    .gate{width:min(480px,100%);background:linear-gradient(180deg,rgba(17,24,36,.94),rgba(7,11,18,.97));border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 24px 90px rgba(0,0,0,.55),0 0 60px rgba(0,242,254,.06);position:relative;overflow:hidden}
    .gate:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--cyan),var(--magenta))}.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--cyan);font-weight:800}.brand{font-size:34px;line-height:1;margin:12px 0 10px;font-weight:900;letter-spacing:-.04em}.brand span{color:var(--magenta)}p{color:var(--muted);line-height:1.6;margin:0 0 26px}label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;color:#aab7ca;margin-bottom:8px}input{width:100%;border:1px solid #283548;background:#070b12;color:white;border-radius:12px;padding:14px 15px;font:inherit;outline:none;transition:.2s}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,242,254,.1)}button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px 16px;font-weight:900;letter-spacing:.08em;background:linear-gradient(90deg,var(--cyan),#7bf7ff);color:#001014;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.meta{display:flex;justify-content:space-between;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid #182231;color:#637086;font-size:11px}.error{min-height:20px;margin-top:12px;color:#ff6e9d;font-size:13px}.lock{font-size:46px;margin-bottom:4px;filter:drop-shadow(0 0 16px rgba(0,242,254,.25))}
  </style>
</head>
<body>
  <main class="gate">
    <div class="lock">⌬</div>
    <div class="eyebrow">PRIVATE ACCESS // T3A DEMO</div>
    <div class="brand">TEAM TIC-TAC-TOE <span>ARENA</span></div>
    <p>This multiplayer prototype is private. Enter the access password supplied by the project owner.</p>
    <form id="loginForm">
      <label for="password">ACCESS PASSWORD</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" autofocus required />
      <button id="submit" type="submit">ENTER ARENA</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <div class="meta"><span>SERVER-SIDE AUTH</span><span>HTTPONLY SESSION</span><span>WSS PROTECTED</span></div>
  </main>
  <script>
    const form=document.getElementById('loginForm'),input=document.getElementById('password'),button=document.getElementById('submit'),error=document.getElementById('error');
    form.addEventListener('submit',async(e)=>{e.preventDefault();error.textContent='';button.disabled=true;button.textContent='AUTHENTICATING…';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:input.value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Access denied.');location.reload()}catch(err){error.textContent=err.message;input.select()}finally{button.disabled=false;button.textContent='ENTER ARENA'}});
  </script>
</body>
</html>
